apiVersion: v1
kind: Pod
metadata:
  name: feast-sparkapp-e2e-setup
  namespace: aniket-cursor-test
spec:
  restartPolicy: Never
  serviceAccountName: default
  containers:
    - name: setup
      image: registry.redhat.io/ubi9/python-311:latest
      command:
        - /bin/bash
        - -c
        - |
          pip install boto3 numpy pandas pyarrow feast grpcio grpcio-reflection grpcio-health-checking --quiet &&
          cd /app &&
          python setup_data.py
      volumeMounts:
        - name: scripts
          mountPath: /app
      env:
        - name: MINIO_ENDPOINT
          value: "http://minio.aniket-cursor-test.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: REGISTRY_HOST
          value: "feast-byos-spark-e2e-registry.aniket-cursor-test.svc.cluster.local:80"
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "2"
  volumes:
    - name: scripts
      configMap:
        name: sparkapp-e2e-scripts
