apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30432
    protocol: TCP
  selector:
    app: postgres-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-proxy
  template:
    metadata:
      labels:
        app: postgres-proxy
    spec:
      containers:
      - name: socat
        image: alpine/socat:latest
        command: ["socat"]
        args: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:host.docker.internal:5432"]
        ports:
        - containerPort: 5432
