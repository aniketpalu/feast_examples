apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: spark-pg-e2e
  namespace: feast-spark
  labels:
    feature-store-ui: enabled
spec:
  feastProject: feast_spark_pg_e2e
  feastProjectDir:
    git:
      url: https://github.com/aniketpalu/feast_examples.git
      ref: byos-spark-postgres
      featureRepoPath: feature_repo
  # No initImage — init containers use operator RELATED_IMAGE_FEATURE_SERVER
  # No per-service server.image — same RELATED_IMAGE default
  services:
    offlineStore:
      persistence:
        store:
          type: postgres
          secretRef:
            name: postgres-offline-config
      server: {}
    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: redis-config
      server: {}
    registry:
      local:
        persistence:
          store:
            type: sql
            secretRef:
              name: postgres-registry-config
        server:
          restAPI: true
    ui: {}
  batchEngine:
    configMapRef:
      name: spark-pg-batch-engine
