# Feast online_store secret — key name must be "milvus" (dbPersistence.type).
# Operator merges YAML into online_store config.
apiVersion: v1
kind: Secret
metadata:
  name: milvus-config
  namespace: feast-spark
type: Opaque
stringData:
  milvus: |
    host: http://milvus
    port: 19530
    vector_enabled: true
    embedding_dim: 384
    index_type: FLAT
    metric_type: COSINE
