apiVersion: batch/v1
kind: Job
metadata:
  name: spark-rag-e2e
  namespace: feast-spark
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: feast-spark-rag-batch-driver
      containers:
        - name: test
          image: quay.io/aniket-redhat/feature-server:byos-spark-e2e-v18
          imagePullPolicy: Always
          env:
            - name: FEAST_ONLINE_URL
              value: https://feast-spark-rag-online.feast-spark.svc.cluster.local:443
            - name: FEAST_CA_CERT_FILE_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
            - name: MILVUS_HOST
              value: http://milvus
            - name: MILVUS_PORT
              value: "19530"
            - name: PARQUET_PATH
              value: /data/city_embeddings.parquet
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minioadmin
            - name: AWS_ENDPOINT_URL_S3
              value: http://minio:9000
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              git clone --depth 1 --branch feast-rag \
                https://github.com/aniketpalu/feast_examples.git /tmp/feast_examples
              cp /tmp/feast_examples/feature_repo/data/city_embeddings.parquet /data/city_embeddings.parquet
              # Upload to MinIO if missing
              pip install -q boto3 2>/dev/null || true
              python3 /tmp/feast_examples/e2e/rag/upload_to_minio.py
              python3 /tmp/feast_examples/e2e/rag/test_rag_e2e.py
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
