# Minimal Milvus standalone for Option A RAG (vector online store).
# OpenShift: SA needs anyuid (embedded etcd). Prefer docker.io; fall back if blocked.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: milvus
  namespace: feast-spark
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-data
  namespace: feast-spark
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: feast-spark
  labels:
    app: milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      serviceAccountName: milvus
      containers:
        - name: milvus
          image: quay.io/aniket-redhat/milvus:v2.4.15
          args: ["milvus", "run", "standalone"]
          env:
            - name: ETCD_USE_EMBED
              value: "true"
            - name: COMMON_STORAGETYPE
              value: local
            - name: DEPLOY_MODE
              value: STANDALONE
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: milvus-data
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: feast-spark
spec:
  selector:
    app: milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
    - name: metrics
      port: 9091
      targetPort: 9091
