apiVersion: v1
kind: Pod
metadata:
  name: feast-e2e-setup-data
  namespace: aniket-cursor-test
spec:
  restartPolicy: Never
  containers:
  - name: setup
    image: python:3.10-slim
    command: ["python", "/scripts/setup_data.py"]
    volumeMounts:
    - name: scripts
      mountPath: /scripts
  volumes:
  - name: scripts
    configMap:
      name: feast-e2e-setup-scripts
